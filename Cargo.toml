[package]
name = "wot-replay-manager"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.28"
egui = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
directories = "5"
serde_ini = "0.2"
anyhow = "1"

# Reuse the existing replay parser crate.
wot_replay_parser = "0.2.2"
embed-resource = "3.0.9"

[build-dependencies]
embed-resource = "3.0.9"

